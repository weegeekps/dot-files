set -g @plugin 'tmux-plugins/tmp'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'noscript/tmux-mighty-scroll'
set -g @plugin 'tmux-plugins/tmux-cpu'

run '~/.tmux/plugins/tpm/tpm'

set -g @plugin 'dracula/tmux'

set -g extended-keys on

set -s default-terminal 'tmux-256color'
# Edit status lines in theme.
source-file ~/.tmux/themes/tomorrow-night.tmux

# Better split keys
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -v -c "#{pane_current_path}"

# --- F12 nested-tmux passthrough toggle ---
# Local tmux goes dormant so ALL keys (incl. C-b) reach the remote
# session. Status bar turns red. Press F12 again to reclaim control.
bind-key -T root F12 \
  set-option prefix None \;\
  set-option key-table off \;\
  set-option status-style "bg=red" \;\
  if-shell -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S

bind-key -T off F12 \
  set-option -u prefix \;\
  set-option -u key-table \;\
  set-option -u status-style \;\
  refresh-client -S
# --- end F12 passthrough toggle ---

