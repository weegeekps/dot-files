# hypridle configuration — replaces xss-lock for the Hyprland session
# See hyprland_plan.md §6.4. hyprlock is the Wayland-native locker
# (betterlockscreen/i3lock-color are X11-only). rofi-power-menu's
# `lockscreen` choice calls `loginctl lock-session`, which hypridle catches
# via the `lock` listener and runs `lock_cmd` (hyprlock).

general {
    lock_cmd = pidof hyprlock || hyprlock      # start locker if not already running
    unlock_cmd = killall -q hyprlock           # dismiss on unlock
    before_sleep_cmd = loginctl lock-session   # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' # wake the displays
}

# Lock when the session is asked to lock (rofi-power-menu, loginctl lock-session)
# NOTE: logind lock requests are handled by general.lock_cmd above, NOT a
# listener. A timeout=0 listener would fire hyprlock on every idle tick.

# Idle lock after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn displays off after 10 minutes
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
