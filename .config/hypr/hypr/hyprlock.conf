# hyprlock configuration — Nord-themed lock screen
# See https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/
# Nord palette: https://www.nordtheme.com/

# ── Background: satpaper image, blurred & dimmed ─────────────────────────────
background {
    monitor =
    path = /home/amorris/tmp/satpaper/satpaper_latest.png
    blur_passes = 2
    blur_size = 4
    brightness = 0.5
    noise = 0.01
}

# ── Clock ─────────────────────────────────────────────────────────────────────
label {
    monitor =
    text = $TIME
    text_align = center
    color = rgba(ECEFF4FF)          # nord6 — snow storm, lightest
    font_size = 96
    font_family = Sans Serif
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(2E3440CC)   # nord0
    position = 0, 120
    halign = center
    valign = center
}

# ── Date ──────────────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date '+%A, %B %-d'
    text_align = center
    color = rgba(88C0D0FF)          # nord8 — frost, light blue
    font_size = 24
    font_family = Sans Serif
    position = 0, 40
    halign = center
    valign = center
}

# ── Password input ────────────────────────────────────────────────────────────
input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(5E81ACEE)    # nord10 — frost, dark blue border
    inner_color = rgba(2E3440DD)    # nord0 — polar night, semi-opaque
    font_color = rgba(ECEFF4FF)     # nord6
    fade_on_empty = true
    placeholder_text = <i>Enter password</i>
    hide_input = false
    position = 0, -60
    halign = center
    valign = center
}

# ── "Locked" hint ─────────────────────────────────────────────────────────────
label {
    monitor =
    text = <i>locked</i>
    color = rgba(4C566AFF)          # nord3
    font_size = 14
    font_family = Sans Serif
    position = 0, -120
    halign = center
    valign = center
}
