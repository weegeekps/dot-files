# hyprpaper configuration — wallpaper daemon for Hyprland
# NOTE: hyprpaper 0.8+ changed the config format. The old
# `preload =`/`wallpaper =` syntax was removed in favor of a
# `wallpaper { }` block. Preload is no longer needed.
# See https://github.com/hyprwm/hyprpaper/pull/288

splash = false

# Display the satpaper near-real-time satellite image on both monitors.
# Empty `monitor =` is a wildcard applying to all outputs.
wallpaper {
    monitor =
    path = /home/amorris/tmp/satpaper/satpaper_latest.png
    fit_mode = cover
}

# Live reload: satpaper overwrites satpaper_latest.png every few minutes, but
# hyprpaper caches the image at load time. To refresh after an update (0.8+ IPC):
#   hyprctl hyprpaper wallpaper ',/home/amorris/tmp/satpaper/satpaper_latest.png,cover'
