# XDG desktop portal routing for the Hyprland session.
# Named hyprland-portals.conf so it only applies when XDG_CURRENT_DESKTOP=Hyprland
# (set in hyprland.conf). The i3/X11 session is unaffected.

[preferred]
# Default: GTK handles file pickers, print, notifications, settings, etc.
default=gtk

# Screen capture + global shortcuts: Hyprland-native backend
org.freedesktop.impl.portal.ScreenCast=hyprland
org.freedesktop.impl.portal.Screenshot=hyprland
org.freedesktop.impl.portal.GlobalShortcuts=hyprland

# File pickers: GTK for both Qt6 (Dolphin) and GTK apps, since no KDE portal
# is installed. Dolphin's own file-open dialogs work natively without a portal
# for most cases; this is the fallback for apps that do request one.
org.freedesktop.impl.portal.FileChooser=gtk
